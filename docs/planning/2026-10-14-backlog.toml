[[issues]]
key = "srs-rewrite"
title = "Roadmap 1.4a: rewrite the SRS around the roadmap (Stages 1 to 3 as requirements with acceptance criteria)"
labels = ["type: docs", "area: process", "priority: high", "status: blocked"]
milestone = "Phase 1: Decide and specify"
body = '''
**Context:** roadmap step 1.4. [`docs/SRS.md`]({blob}docs/SRS.md) sections 1 to 7 still describe the Stage 0 plan; decisions D29 to D45 and the approved architecture ([`docs/ARCHITECTURE.md`]({blob}docs/ARCHITECTURE.md)) are not yet requirements.

**Task:** rewrite sections 1 to 8 so that each phase's deliverables become numbered requirements with acceptance criteria; keep section 9 (decisions) and section 10 (prior work). Stage 0 requirements move to an appendix as the historical record.

**Acceptance criteria**
- [ ] Every architecture "Rule" maps to a requirement ID or is listed as deliberately left out.
