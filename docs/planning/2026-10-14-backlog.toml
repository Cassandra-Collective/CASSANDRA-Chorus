[[issues]]
key = "ad-13"
title = "Decision AD-13: round length and the update-size budget per round"
labels = ["type: decision", "area: protocol", "area: storage", "priority: high", "status: needs owner"]
milestone = "Phase 1: Decide and specify"
assignees = ["owner"]
body = '''
**Decision needed by:** the protocol specification (roadmap 3.1); new on 2026-10-14 from the P3 smoke test.

**Context:** [architecture sections 6.1 and 9]({blob}docs/ARCHITECTURE.md). The system study's arithmetic assumed 30-minute rounds. From one home: 8.4 Mbit/s up, 13.2 down. One 0.6 GB update takes about 9.5 minutes up. Round length L, the training deadline D, and the largest update a round can carry must fit the slowest member's link plus training time.

**Input expected:** the reduced P3 run (Phase 1) and the update-size study (Phase 3).

**How to record it:** comment here; it becomes an SRS D-number and the configuration's defaults.
'''

