[[issues]]
key = "ad-11"
title = "Decision AD-11: does every peer download all updates and merge, or one peer merges and others spot-check"
labels = ["type: decision", "area: merge", "area: storage", "priority: high", "status: needs owner"]
milestone = "Phase 1: Decide and specify"
assignees = ["owner"]
body = '''
**Decision needed by:** after the P3 transfer results; asked for early by the owner.

**Context:** [architecture section 9]({blob}docs/ARCHITECTURE.md). In full-copy mode a peer that merges everything downloads N - 1 updates: at 5 peers and 0.6 GB, 2.4 GB per round, about 25 minutes at the 13.2 Mbit/s measured from one home ([P3 smoke test]({blob}results/prototypes/p3_smoke_bucket_0.1GB.md)). A designated merger cuts this to one checkpoint per peer but asks the others to trust or spot-check it.

**Options:** every peer merges; the designated publisher merges and others verify the parts they hold (sliced) or spot-check; a mix by work-unit kind.

**How to record it:** comment here; it becomes an SRS D-number.
'''

