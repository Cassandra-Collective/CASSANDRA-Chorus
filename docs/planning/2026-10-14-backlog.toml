[[issues]]
key = "ad-6"
title = "Decision AD-6: synchronous mode's abort timeout"
labels = ["type: decision", "area: protocol", "priority: medium", "status: needs owner"]
milestone = "Phase 3: Network v0 on our machines"
assignees = ["owner"]
body = '''
**Decision needed by:** Gate N1a.

**Context:** [architecture section 6.5]({blob}docs/ARCHITECTURE.md). In synchronous mode (D38) a round closes only when every assigned member has posted; after a long timeout the closer posts `abort` and the round is rerun with the same assignment. Without a timeout the round can wait forever (the flaw the system study found in flwr-serverless).

**How to record it:** comment here; it becomes an SRS D-number.
'''

[[issues]]
key = "ad-7"
title = "Decision AD-7: full states or deltas as the update format"
labels = ["type: decision", "area: merge", "area: storage", "priority: high", "status: needs owner"]
milestone = "Phase 1: Decide and specify"
assignees = ["owner"]
body = '''
**Decision needed by:** the protocol specification (roadmap 3.1); asked for early by the owner.

**Context:** [architecture section 7.1, step 6]({blob}docs/ARCHITECTURE.md). P6 at full scale ([result]({blob}results/prototypes/p6_merge_determinism.md)): rebuilding W = G - Δ from deltas before merging gave the same bits as full states on the CPU; merging the deltas directly did not (355,790 and 499,977 differing elements). Either works if every peer does the same thing.

**Related:** the update-size study in Phase 3 may favour deltas if they compress better (not measured).

**How to record it:** comment here; it becomes an SRS D-number and a rule in architecture section 7.
'''

[[issues]]
key = "ad-8"
title = "Decision AD-8: bitwise hashes or a tolerance check for merge agreement"
labels = ["type: decision", "area: merge", "priority: medium", "status: needs owner"]
milestone = "Phase 3: Network v0 on our machines"
assignees = ["owner"]
body = '''
**Decision needed by:** after the cross-machine merge test on a second machine (Phase 3).

**Context:** [architecture section 7.2]({blob}docs/ARCHITECTURE.md). On one machine the CPU merge is bitwise stable across repeats, threads, result order and file round trips (P6). Equal hashes there are necessary, not sufficient: other machines and PyTorch builds are untested. The fallback is a tolerance check, as Templar's sync score does.

**How to record it:** comment here; it becomes an SRS D-number.
'''

