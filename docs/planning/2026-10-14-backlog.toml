[[issues]]
key = "od-6"
title = "Decision OD-6: target devices for local inference (sets the model size range)"
labels = ["type: decision", "area: model", "area: inference", "priority: high", "status: needs owner"]
milestone = "Phase 1: Decide and specify"
assignees = ["owner"]
body = '''
**Decision needed by:** before the pilot model's size is fixed (roadmap 4.3). Raised to Phase 1 because model size now drives update size, which is a measured constraint.

**Context**
- Product spec (#20), section 7: all parameters must fit in the user's device memory (an MoE's experts all count); the range is roughly 100M to 1B parameters, to be calculated, not assumed.
- [Architecture section 9]({blob}docs/ARCHITECTURE.md): from one home, 8.4 Mbit/s up and 13.2 down. A 100M to 300M model in float32 is 0.4 to 1.2 GB per full update, about 6 to 19 minutes to upload (arithmetic, assuming similar links).

**Options (examples from the spec):** a laptop with an 8 GB GPU; CPU-only with 16 GB of memory.

**How to record it:** comment here; it becomes an SRS D-number and the spec's section 7 gets the calculated range.
'''

