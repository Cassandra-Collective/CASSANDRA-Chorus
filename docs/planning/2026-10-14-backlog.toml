[[issues]]
key = "merge-division-bug"
title = "merge.py: GPU merge differs from CPU (CUDA divides by a Python scalar via its reciprocal)"
labels = ["type: bug", "area: merge", "priority: high"]
milestone = "Phase 3: Network v0 on our machines"
body = '''
**Found by:** prototype P6 on 2026-10-14 ([result]({blob}results/prototypes/p6_merge_determinism.md)).

**What happens:** `_weighted_mean` in [`cassandra_chorus/coordinator/merge.py`]({blob}cassandra_chorus/coordinator/merge.py) ends with `acc / total`, where `total` is a Python number. On CUDA, PyTorch computes this as a multiplication by the reciprocal. At 46M parameters the sliced merge on the GPU differed from the CPU in 472 elements (largest difference 5.96e-08). Dividing by a float64 tensor on the device made them bitwise equal, in member and shuffled order.

**Task**
- [ ] Divide by a float64 tensor on the accumulator's device.
- [ ] A GPU test (marked `gpu`) that the merge is bitwise equal on CPU and GPU.
- [ ] Document that the Nesterov velocity must be stored and published as float64 (float32 storage changed round 2's model in 204,432 elements).
- [ ] An implementation document; the Stage 0 merge on the CPU is unchanged (check against `tests/test_coordinator.py`).
'''

