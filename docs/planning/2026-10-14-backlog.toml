[[issues]]
key = "ad-1"
title = "Decision AD-1: where the signing key lives, its backup, and whether maintainers co-sign later"
labels = ["type: decision", "area: security", "priority: medium", "status: needs owner"]
milestone = "Phase 3: Network v0 on our machines"
assignees = ["owner"]
body = '''
**Decision needed by:** the first signed release or configuration.

**Context:** [architecture sections 4 and 12]({blob}docs/ARCHITECTURE.md). The owner signs releases and run configurations offline with an Ed25519 key (D37, D40). Prototype P9 passed all 7 cases on one machine ([result]({blob}results/prototypes/p9_signing_dry_run.md)). A new key is accepted only if the old key signs it (BOINC's rule). D40 foresees maintainers later.

**Questions**
- Where is the private key kept (offline device, password manager, hardware key)?
- How many backups, and where?
- Later: one owner key, or co-signing by maintainers?

**How to record it:** comment here; it becomes an SRS D-number and architecture section 4 is updated.
'''

[[issues]]
key = "ad-2"
title = "Decision AD-2: does the round log live in a Hugging Face organisation of its own"
labels = ["type: decision", "area: protocol", "area: security", "priority: medium", "status: needs owner"]
milestone = "Phase 3: Network v0 on our machines"
assignees = ["owner"]
body = '''
**Decision needed by:** before Phase 3 networking.

**Context:** [architecture sections 4, 5 and 13]({blob}docs/ARCHITECTURE.md). Several members must write the log. On the Hub, the `write` role can "create, delete, or rename any repo" in its organisation (system study Q7), so a log in its own organisation limits what a member's access can reach. P0 showed that a token with only `repo.contribute.write` creates and writes the organisation's repositories ([result]({blob}results/prototypes/p0_hub_scope_probe.md)). Whether such a token can write a repository created by another account is not yet tested (second-account test in Phase 3).

**Options:** the log in `cassandra-chorus` with the rest; the log in a separate organisation with members holding `write` only there.

**How to record it:** comment here; it becomes an SRS D-number.
'''

[[issues]]
key = "ad-3"
title = "Decision AD-3: which host mirrors the checkpoints"
labels = ["type: decision", "area: storage", "priority: medium", "status: needs owner"]
milestone = "Phase 3: Network v0 on our machines"
assignees = ["owner"]
body = '''
**Decision needed by:** Phase 3, before checkpoints are published.

**Context:** [architecture sections 5 and 9]({blob}docs/ARCHITECTURE.md). Every checkpoint is copied to a second host, so one host's outage stops rounds but loses nothing.

**Options (system study Q5):** GitHub release assets (under 2 GiB each on free accounts; 500 content-creating API requests per hour); a second Hugging Face organisation; Cloudflare R2 (needs a subscription that may become paid; flagged against D37's "nothing the owner pays for").

**How to record it:** comment here; it becomes an SRS D-number.
'''

