name: Bug
description: Something behaves wrongly.
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Observed behaviour, with exact error text if short.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Minimal steps, command lines and configuration.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python, PyTorch (and CUDA) versions, GPU, commit hash.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, result files, run IDs. Never paste tokens or keys.
