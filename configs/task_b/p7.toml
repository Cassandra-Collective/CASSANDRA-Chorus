# P7 proposal, unrun. Review the registered reading before launching the queue.
# 24,000 offered worker steps; actual spent and merged steps are logged separately.
[run]
name = "p7-deadline-q1-n4"
seed = 7
device = "cuda"
determinism = "warn"

[model]
vocab_size = 27
context_length = 256
d_model = 384
n_layers = 6
n_heads = 6
expert_hidden = 768
n_experts = 8
top_k = 2
balance_coef = 0.01
attention = "explicit"
dispatch = "sparse"

[text8]
file = "text8/text8"
sha256 = "6e890197040d37d85beb962ae1f041ff1d9a9ca8d20c7d99c85027eebf51dca7"
context_length = 256

[optim]
lr = 1e-3
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.0
warmup_steps = 100
grad_clip = 1.0
batch_size = 32
decay_fraction = 0.2
final_lr_ratio = 0.1

[eval]
curve_max_chars = 1000000
save_model = true

[sim]
n_workers = 4
capacity = 4
local_steps = 100
rounds = 60
equal_compute_steps = 24000
mode = "sliced"
policy = "rolling"
cross_layer = "same"
router_rule = "holders"
outer = "plain"
round_mode = "deadline"
q_min = 1
round_length = 160.0
deadline = 110.0
grace = 10.0
speed_min = 0.75
speed_max = 1.25
upload_min = 1.0
upload_max = 8.0
sync_timeout = 200.0
churn_file = "configs/task_b/p7-churn.toml"
churn_sha256 = "08afa95188571898a80f0f24e5fac5fb37a4e5531035d00132a617311b2071c0"
holder_quality = true
