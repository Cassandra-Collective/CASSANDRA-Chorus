# PLAN step 10, part a: Task B timing pilot (owner decision 2026-10-08, SRS D25).
# Times three model sizes in every worker mode on real text8 batches; untrained models, times and memory only.
# fp32 with explicit attention (owner decision 2026-10-09); sparse dispatch (owner decision 2026-10-07).

[run]
name = "taskB-timing-pilot"
seed = 7
device = "cuda"
determinism = "warn"

[text8]
file = "text8/text8"     # under CHORUS_DATA_DIR (C:\Users\senso\chorus-data on the reference laptop)
sha256 = "6e890197040d37d85beb962ae1f041ff1d9a9ca8d20c7d99c85027eebf51dca7"
context_length = 256

[optim]                  # Task A's optimizer; batch_size is set per timing from pilot.batch_sizes
lr = 1e-3
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.0
warmup_steps = 100
grad_clip = 1.0
decay_fraction = 0.2
final_lr_ratio = 0.1

[sim]                    # the Gate A main setting (D18, D20): 4 workers, 4 of 8 experts, coverage
n_workers = 4
capacity = 4
policy = "coverage"
router_rule = "holders"

[pilot]
widths = [256, 320, 384]   # 20,476,672 / 31,985,600 / 46,050,432 parameters
n_layers = 6
n_experts = 8
top_k = 2
head_width = 64
expert_ratio = 2
batch_sizes = [32, 64]
warmup_steps = 10
timed_steps = 50
merge_repeats = 5
