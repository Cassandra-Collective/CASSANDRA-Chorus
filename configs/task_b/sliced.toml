# PLAN step 10: the simulated Task B arms on text8 (owner decisions D25, D26, 2026-10-08 and 2026-10-09).
# Default: the sliced arm in the Gate A main setting. Other arms (configs/queues/task_b_matrix.toml):
#   --set sim.mode=full    --set sim.router_rule=all --set run.name=taskB-fullavg
#   --set sim.mode=partial --set sim.router_rule=all --set run.name=taskB-partial
# Equal compute (D17): 4 workers x 125 local steps x 40 rounds = 20,000 worker steps of 32 x 256 characters.

[run]
name = "taskB-sliced-coverage"
seed = 7
device = "cuda"
determinism = "warn"

[model]                  # 46,050,432 parameters, as configs/task_b/centralized.toml
vocab_size = 27
context_length = 256
d_model = 384
n_layers = 6
n_heads = 6
expert_hidden = 768
n_experts = 8
top_k = 2
balance_coef = 0.01       # Switch load-balancing loss (D27)
attention = "explicit"
dispatch = "sparse"

[text8]
file = "text8/text8"
sha256 = "6e890197040d37d85beb962ae1f041ff1d9a9ca8d20c7d99c85027eebf51dca7"
context_length = 256

[optim]                  # schedule along each worker's 5,000-step trajectory (round x 125 + local step)
lr = 1e-3
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.0
warmup_steps = 100
grad_clip = 1.0
batch_size = 32
decay_fraction = 0.2
final_lr_ratio = 0.1

[eval]
curve_max_chars = 1000000
save_model = true

[sim]                    # Gate A main setting (D18, D20), R from D26
n_workers = 4
capacity = 4
local_steps = 125
rounds = 40
mode = "sliced"
policy = "coverage"
cross_layer = "same"
router_rule = "holders"
outer = "plain"
drop_prob = 0.0
skew = 0.0
equal_compute_steps = 20000
