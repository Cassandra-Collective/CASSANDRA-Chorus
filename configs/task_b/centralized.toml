# PLAN step 10: centralized Task B on text8 (owner decisions D25, D26, 2026-10-08 and 2026-10-09).
# Seeds 7, 11, 19 via --set run.seed=<seed>. The learning check uses --set train.steps=2000 --set train.eval_every=250.

[run]
name = "taskB-central"
seed = 7
device = "cuda"
determinism = "warn"

[model]                  # 46,050,432 parameters
vocab_size = 27
context_length = 256
d_model = 384
n_layers = 6
n_heads = 6
expert_hidden = 768
n_experts = 8
top_k = 2
balance_coef = 0.0
attention = "explicit"   # deterministic path (owner decision 2026-10-09)
dispatch = "sparse"

[text8]
file = "text8/text8"     # under CHORUS_DATA_DIR
sha256 = "6e890197040d37d85beb962ae1f041ff1d9a9ca8d20c7d99c85027eebf51dca7"
context_length = 256

[optim]                  # Task A's optimizer (D26)
lr = 1e-3
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.0
warmup_steps = 100
grad_clip = 1.0
batch_size = 32
decay_fraction = 0.2
final_lr_ratio = 0.1

[train]
steps = 20000            # 163,840,000 characters (D26)
eval_every = 1000
curve_max_chars = 1000000
save_model = true
